<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferro POS – Receipts & Product Finder</title>
<style>
:root{--bg:#f3f1ec;--surface:#fff;--ink:#1c2430;--muted:#667082;--line:#d9d5cc;--accent:#d4540a;--on-accent:#fff;--chip:#e9e5dc;--ok:#2b7a4b;--bad:#b3261e;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--surface:#1b212b;--ink:#e8eaee;--muted:#98a1b0;--line:#313a48;--accent:#ff7a30;--on-accent:#1a1006;--chip:#252d39;--ok:#5cc489;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#12161d;--surface:#1b212b;--ink:#e8eaee;--muted:#98a1b0;--line:#313a48;--accent:#ff7a30;--on-accent:#1a1006;--chip:#252d39;--ok:#5cc489;--bad:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0;letter-spacing:.04em;text-transform:uppercase}
h1 span{color:var(--accent)}
nav{display:flex;gap:6px;margin-left:auto}
nav button{padding:8px 16px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--chip);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 9px;font-size:13px}
.results{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:280px;overflow:auto;background:var(--surface)}
.res{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.res:hover{background:var(--chip)}
.res:last-child{border:0}
.muted{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td input{padding:6px 7px}
.num{text-align:right;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);margin-left:6px}
.badge.bad{color:var(--bad)}
.loc{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.loc.def{font-weight:500;color:var(--muted)}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:20px 18px;font:13px/1.5 "Courier New",ui-monospace,monospace;max-width:400px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.paper h3{margin:0;text-align:center;font-size:16px;letter-spacing:.05em}
.paper .c{text-align:center}
.paper hr{border:0;border-top:1px dashed #777;margin:9px 0}
.paper .ln{display:flex;justify-content:space-between;gap:8px}
.paper .it{margin-bottom:5px}
.hide{display:none}
details summary{cursor:pointer;font-weight:600}
.hrec{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--bg)}
.hrec summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;font-weight:500}
.hrec .in{padding:0 12px 12px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:8px 0 0}
@media print{
  header,.noprint,.card:not(.printable){display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .grid{display:block}
  .card.printable{border:0;padding:0;margin:0;background:#fff}
  .paper{border:0;box-shadow:none;max-width:none}
}
</style>
</head>
<body>
<header>
  <h1>Ferro <span>POS</span></h1>
  <nav role="tablist">
    <button role="tab" id="tab-receipt" aria-selected="true">Make Receipt</button>
    <button role="tab" id="tab-finder" aria-selected="false">Find Product</button>
    <button role="tab" id="tab-history" aria-selected="false">🔒 History</button>
  </nav>
</header>
<main>

<!-- RECEIPT PAGE -->

  <div>
    <div class="card">
      <h2>Customer</h2>
      <div class="row">
        <div><label for="cName">Customer name</label><input id="cName" placeholder="Walk-in customer"></div>
        <div><label for="cAddr">Address / contact (optional)</label><input id="cAddr"></div>
      </div>
    </div>

    <div class="card">
      <h2>Add items</h2>
      <label for="addq">Search the price list (<span id="count"></span> items)</label>
      <input id="addq" placeholder="e.g. welding rod, drill bit 1/4, GI sheet…" autocomplete="off">
      <div id="addres" class="results hide"></div>
      <details style="margin-top:12px"><summary>Add a
